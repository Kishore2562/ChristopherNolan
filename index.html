<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Christopher Nolan Film Gallery</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron&display=swap" rel="stylesheet">
</head>

<body>

  <!-- 🔭 Header & Navigation -->
  <header class="main-header">
    <h1 class="glow-title">Nolan’s Artistic Work Gallery</h1>
    <nav class="navbar">
      <a href="#video">Opening</a>
      <a href="#quiz">Quiz</a>
      <a href="#gallery">Gallery</a>
      <a href="#weather">Weather</a>
    </nav>
  </header>

  <!-- 🎥 Cinematic Opening Video -->
  <section id="video" class="video-section">
    <div class="video-frame">
      <iframe 
        width="100%" 
        height="500" 
        src="https://www.youtube.com/embed/bK6ldnjE3Y0?start=70&autoplay=1&mute=1" 
        frameborder="0" 
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <!-- ❓ Oscar Quiz -->
  <section id="quiz" class="quiz-section">
    <h2>How many Oscars has Christopher Nolan won?</h2>
    <div class="quiz-options">
      <button onclick="checkAnswer(1)">1</button>
      <button onclick="checkAnswer(3)">3</button>
      <button onclick="checkAnswer(2)">2</button>
      <button onclick="checkAnswer(6)">6</button>
    </div>
    <p id="quiz-result"></p>
  </section>

  <!-- 🎠 Film Carousel -->
  <section id="gallery" class="carousel-section">
    <h2>Nolan’s Masterpieces</h2>
    <div class="carousel">
      <!-- FIRST IMAGE LOADS BY DEFAULT -->
      <img 
        id="carousel-image" 
        src="imgnolan1.jpg" 
        alt="Christopher Nolan Film">
    </div>
  </section>

  <!-- 🌦️ Weather API -->
  <section id="weather" class="weather-section">
    <h2>Live Weather</h2>
    <input type="text" id="city-input" placeholder="Enter city name">
    <button onclick="getWeather()">Check Weather</button>
    <p id="weather-result"></p>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Satya Kishore | Christopher Nolan Tribute</p>
  </footer>

  <!-- Script -->
  <script src="script.js"></script>

</body>
</html>
